{{define "content"}}
<form method="post" action="/login/password" class="stack">
{{template "hidden" .}}
<div class="field">
<label class="label" for="username">Email</label>
<input class="input input-readonly" id="username" name="username" type="email" value="{{.Email}}" autocomplete="username" readonly>
</div>
<div class="field">
<div class="inline-row"><label class="label" for="password">Password</label><a class="text-link text-xs" href="/reset{{.Query}}">Forgot password?</a></div>
<div class="password-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password" autofocus{{if .Error}} aria-invalid="true" aria-describedby="form-error"{{end}}><button class="reveal" type="button" data-reveal="password" hidden aria-controls="password" aria-pressed="false">Show</button></div>
</div>
<button class="button button-primary" type="submit" name="action" value="password">Sign in</button>
<button class="button button-ghost" type="submit" name="action" value="code" formnovalidate>{{icon "mail"}}Email me a code instead</button>
</form>
{{end}}
{{define "footer"}}{{template "restart" .}}{{end}}
