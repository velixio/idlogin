# id.example.com — Zitadel and idlogin behind nginx (TLS terminated here).
# Zitadel speaks HTTP/1.1, HTTP/2 and gRPC on one port, so everything except
# the sign-in paths goes to it over h2c with grpc_pass. Copy per brand (e.g.
# id.other.example) and change server_name and certificates only; the same
# Zitadel and the same idlogin answer every instance domain (idlogin picks the
# brand from the Host header, see docs/idlogin.md).


server {
    listen 80;
    listen [::]:80;
    server_name id.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name id.example.com;

    ssl_certificate     /etc/letsencrypt/live/id.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 10m;

    # Sign-in (cmd/idlogin, idlogin.service on 127.0.0.1:8091): /login,
    # /login/* (incl. /login/static/ and /login/brand/logo), /logout, /logout/*,
    # /reset, /reset/*. None of these collide with Zitadel's own routes (/ui,
    # /oauth, /oidc, /v1, /v2, /zitadel.*, /.well-known, /debug, /assets,
    # /idps, /saml, /management, /admin, /auth/v1, /system, /openapi, /device,
    # /resources, /scim). Zitadel itself calls the action target
    # /login/zitadel/preaccesstoken through this host (signature-checked).
    # A regex location wins over the "location /" prefix below.
    location ~ ^/(login|logout|reset)(/|$) {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # idlogin trusts this (LOGIN_TRUST_PROXY=true): always overwrite it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Zitadel API, OIDC endpoints and the admin console. To keep the console
    # off the internet, add an allow/deny block for location /ui/console.
    location / {
        grpc_pass grpc://127.0.0.1:8090;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-Proto https;
        grpc_set_header X-Forwarded-For $remote_addr;
        grpc_buffer_size 16k;
    }
}
